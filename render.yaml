services:
  - type: web
    name: nautilus-btc-straddle-lab
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: BYBIT_BASE_URL
        value: https://api.bybit.com
      - key: ALLOW_LIVE_TRADING
        value: "false"

